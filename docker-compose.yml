name: lostfound

# Shared backend environment (api + worker run the same image).
# Inline defaults make `docker compose up --build` work with zero setup;
# override any value via the host environment or a root .env file.
x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lf}:${POSTGRES_PASSWORD:-lf_pass}@postgres:5432/${POSTGRES_DB:-lostfound}
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-insecure-change-me}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
  MEDIA_ROOT: ${MEDIA_ROOT:-/app/media}
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lf_pass}
      POSTGRES_DB: ${POSTGRES_DB:-lostfound}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lf} -d ${POSTGRES_DB:-lostfound}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Migrate, then seed default categories (idempotent — matches on slug), then serve.
    command: sh -c "alembic upgrade head && python -m app.db.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["arq", "app.workers.main.WorkerSettings"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media:/app/media

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* is inlined at build time. These are the URLs the BROWSER
      # uses, so they must be host-reachable (`localhost`), never compose service
      # names (`api`) — the request originates outside the compose network.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        # Blank: photos resolve same-origin via the /media/* rewrite.
        NEXT_PUBLIC_MEDIA_URL: ${NEXT_PUBLIC_MEDIA_URL:-}
        NEXT_PUBLIC_USE_MOCKS: ${NEXT_PUBLIC_USE_MOCKS:-false}
        # Where the Next server proxies /media/* to. Must be the compose service
        # name — `localhost` inside this container is the container itself,
        # which is why direct API image URLs failed with ECONNREFUSED.
        # Build-time: Next bakes rewrites into its routes manifest.
        MEDIA_ORIGIN: ${MEDIA_ORIGIN:-http://api:8000}
        # Also a build arg: statically prerendered pages bake their canonical
        # and og:url during the build, so runtime alone leaves them wrong.
        SITE_URL: ${SITE_URL:-http://localhost:${FRONTEND_PORT:-3000}}
    # Read at REQUEST time by server components (unlike NEXT_PUBLIC_*, which are
    # baked in at build), so these belong in `environment`, not `args`.
    environment:
      # Server-side fetches for SSR + generateMetadata. Must be the compose
      # service name: `localhost` here is the frontend container itself.
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:8000/api/v1}
      # Absolute origin used to build Open Graph URLs. Set this to the real
      # public domain in production or link previews will point at localhost.
      SITE_URL: ${SITE_URL:-http://localhost:${FRONTEND_PORT:-3000}}
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Override with FRONTEND_PORT when 3000 is already taken (e.g. a local
      # `npm run dev`). Remember to add the new origin to CORS_ORIGINS.
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode===200?0:1))
          .on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pgdata:
  redisdata:
  media:
